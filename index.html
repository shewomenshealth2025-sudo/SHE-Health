<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHE Health | Women’s Health, Made Easy.</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #fff7fb;
      font-family: Arial, Helvetica, sans-serif;
      color: #2b0b27;
      overflow-x: hidden;
    }

    .page-shell {
      width: 100%;
      min-height: 100vh;
      background: #fff7fb;
    }

    .desktop-mockup {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    /* This version keeps the page EXACTLY like the final visual mockup.
       The full design is included as one image so the typography, women, phone,
       emojis, icons, spacing and lower 'What is SHE?' section stay identical. */

    .image-wrap {
      width: 100%;
      max-width: 1536px;
      margin: 0 auto;
      background: #fff7fb;
      position: relative;
    }

    .click-layer a {
      position: absolute;
      display: block;
      text-indent: -9999px;
      overflow: hidden;
    }

    .home-link { left: 31.8%; top: 3.4%; width: 4.3%; height: 2.5%; }
    .discover-link { left: 38%; top: 3.4%; width: 6.8%; height: 2.5%; }
    .forum-link { left: 46.3%; top: 3.4%; width: 7.8%; height: 2.5%; }
    .partners-link { left: 54.8%; top: 3.4%; width: 7.2%; height: 2.5%; }
    .contact-link { left: 62.4%; top: 3.4%; width: 6.5%; height: 2.5%; }
    .early-link { left: 77.1%; top: 1.85%; width: 11.4%; height: 4.7%; }
    .learn-link { left: 9.2%; top: 48.8%; width: 12.2%; height: 4%; }
    .join-link { left: 22.4%; top: 48.8%; width: 11.2%; height: 4%; }

    @media (max-width: 768px) {
      .image-wrap {
        width: 1536px;
        max-width: none;
        transform: scale(calc(100vw / 1536));
        transform-origin: top left;
      }

      .page-shell {
        min-height: calc(1024px * (100vw / 1536));
      }
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <div class="image-wrap">
      <img class="desktop-mockup" src="assets/she-homepage-design.png" alt="SHE Health homepage mockup showing hero section and What is SHE segment" />

      <!-- Optional clickable areas over the exact image mockup. Change hrefs to your actual pages. -->
      <nav class="click-layer" aria-label="SHE homepage navigation">
        <a class="home-link" href="index.html">Home</a>
        <a class="discover-link" href="discover.html">Discover</a>
        <a class="forum-link" href="she-forum.html">SHE Forum</a>
        <a class="partners-link" href="partners.html">Partners</a>
        <a class="contact-link" href="contact.html">Contact</a>
        <a class="early-link" href="join.html">Join Early Access</a>
        <a class="learn-link" href="#what-is-she">Learn more about SHE</a>
        <a class="join-link" href="join.html">Join Early Access</a>
      </nav>
    </div>
  </main>
</body>
</html>
