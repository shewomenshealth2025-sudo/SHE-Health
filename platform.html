<!doctype html>
<html lang="en">
<head>
  <style>
    :root {
      --pink: #ec3d86;
      --pink-dark: #d82f75;
      --pink-soft: #fff3f8;
      --plum: #35102d;
      --muted: #6f5b66;
      --border: #f4d7e5;
      --purple: #8f63dc;
      --green: #2fc46c;
      --blue: #dff0ff;
      --yellow: #fff4d8;
      --white: #fff;
      --shadow: 0 22px 60px rgba(53, 16, 45, 0.10);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #fff7fb, #ffffff);
      color: var(--plum);
    }

    a { text-decoration: none; color: inherit; }
    img { max-width: 100%; display: block; }

    .header {
      height: 88px;
      padding: 0 6%;
      background: white;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand img {
      width: 48px;
      height: 48px;
    }

    .brand strong {
      font-size: 36px;
      color: var(--pink);
      font-weight: 900;
      letter-spacing: -0.05em;
    }

    .brand span {
      font-size: 13px;
      font-weight: 700;
      color: #111;
      border-left: 1px solid var(--border);
      padding-left: 14px;
      line-height: 1.2;
    }

    .nav {
      display: flex;
      gap: 32px;
      align-items: center;
      font-weight: 900;
      font-size: 15px;
    }

    .nav a.active {
      color: var(--pink);
      border-bottom: 2px solid var(--pink);
      padding-bottom: 8px;
    }

    .header-cta {
      background: var(--pink);
      color: white;
      padding: 15px 28px;
      border-radius: 999px;
      font-weight: 900;
      box-shadow: 0 14px 34px rgba(236, 61, 134, 0.25);
    }

    .menu {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: white;
      font-size: 20px;
      display: grid;
      place-items: center;
    }

    .mobile-nav {
      display: none;
      flex-direction: column;
      gap: 16px;
      padding: 22px 6%;
      background: white;
      border-bottom: 1px solid var(--border);
      font-weight: 900;
    }

    .mobile-nav.open { display: flex; }

    .hero {
      min-height: 620px;
      padding: 70px 8%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 60px;
      align-items: center;
      background:
        radial-gradient(circle at 75% 43%, rgba(236,61,134,.25) 0 22%, transparent 23%),
        radial-gradient(circle at 88% 48%, rgba(156,132,230,.16), transparent 24%),
        linear-gradient(135deg, #fff8fc, #fff0f7);
      overflow: hidden;
      position: relative;
    }
      <style>
</head>
