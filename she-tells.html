<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SHE Tells | SHE Health</title>

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="css/global.css">

<style>
:root{
  --pink:#ec3d86;
  --plum:#35102d;
  --muted:#6f5b66;
  --border:#f4d7e5;
  --soft:#fff7fb;
  --gold:#b88a44;
  --shadow:0 22px 60px rgba(53,16,45,.07);
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  color:var(--plum);
  overflow-x:hidden;
}

a{
  text-decoration:none;
  color:inherit;
}

/* MOBILE MENU */

.mobile-menu-btn{
  display:none;
}

.mobile-menu-panel{
  display:none;
}

/* HERO */

.tells-hero{
  padding:96px 7% 64px;
  background:
    radial-gradient(circle at 82% 20%, rgba(236,61,134,.08), transparent 28%),
    linear-gradient(180deg,#fff,#fffafc);
}

.tells-hero-inner{
  max-width:1180px;
  margin:0 auto;
}

.tells-kicker{
  color:var(--pink);
  font-size:13px;
  font-weight:900;
  letter-spacing:.08em;
  text-transform:uppercase;
  margin-bottom:18px;
}

.tells-hero h1{
  font-size:clamp(54px,7vw,92px);
  line-height:.92;
  letter-spacing:-.075em;
  margin:0 0 24px;
  max-width:1020px;
}

.tells-hero h1 span{
  color:var(--pink);
}

.tells-hero p{
  max-width:840px;
  font-size:20px;
  line-height:1.7;
  color:var(--muted);
  margin:0;
}

/* ELITE PANEL */

.expert-panel-section{
  padding:0 7% 80px;
}

.expert-panel{
  max-width:1180px;
  margin:0 auto;
  background:#fff;
  border:1px solid var(--border);
  border-radius:36px;
  padding:46px;
  box-shadow:var(--shadow);
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:42px;
  align-items:start;
}

.expert-panel h2{
  margin:0 0 18px;
  font-size:clamp(38px,5vw,64px);
  line-height:.98;
  letter-spacing:-.06em;
}

.expert-panel h2 span{
  color:var(--pink);
}

.expert-panel p,
.expert-panel li{
  font-size:18px;
  line-height:1.7;
  color:var(--muted);
}

.expert-panel ul{
  margin:0;
  padding-left:20px;
}

.expert-box{
  background:linear-gradient(135deg,#fff,#fff7fb);
  border:1px solid var(--border);
  border-radius:28px;
  padding:30px;
}

.expert-box strong{
  display:block;
  font-size:28px;
  line-height:1.15;
  letter-spacing:-.04em;
  margin-bottom:14px;
  color:var(--plum);
}

/* FILTERS */

.filter-section{
  padding:0 7% 34px;
}

.filter-bar{
  max-width:1180px;
  margin:0 auto;
  display:flex;
  flex-wrap:wrap;
  gap:12px;
}

.filter-btn{
  border:1px solid var(--border);
  background:#fff;
  color:var(--plum);
  padding:12px 18px;
  border-radius:999px;
  font-weight:900;
  cursor:pointer;
}

.filter-btn.active,
.filter-btn:hover{
  background:var(--plum);
  color:#fff;
}

/* INSIGHT CARDS */

.tells-section{
  padding:0 7% 100px;
}

.tells-grid{
  max-width:1180px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1.2fr .8fr;
  gap:24px;
  align-items:start;
}

.tells-stack{
  display:grid;
  gap:24px;
}

.tells-card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:32px;
  padding:34px;
  box-shadow:var(--shadow);
  transition:.25s ease;
}

.tells-card:hover{
  transform:translateY(-4px);
  border-color:var(--pink);
}

.tells-card.featured{
  background:
    linear-gradient(135deg,rgba(255,255,255,.96),rgba(255,247,251,.96)),
    linear-gradient(135deg,#fff,#fff7fb);
  border:1px solid var(--border);
}

.tells-label{
  display:inline-block;
  color:var(--pink);
  font-size:12px;
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.08em;
  margin-bottom:14px;
}

.tells-card h2{
  margin:0 0 14px;
  font-size:clamp(34px,4vw,56px);
  line-height:1;
  letter-spacing:-.055em;
}

.tells-card h3{
  margin:0 0 12px;
  font-size:27px;
  letter-spacing:-.04em;
  line-height:1.05;
}

.tells-card p{
  color:var(--muted);
  font-size:16px;
  line-height:1.7;
  margin:0 0 20px;
}

.expert-meta{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:18px;
}

.meta-pill{
  border:1px solid var(--border);
  background:#fff;
  color:var(--plum);
  border-radius:999px;
  padding:8px 12px;
  font-size:12px;
  font-weight:800;
}

.expand-btn{
  border:0;
  background:var(--plum);
  color:#fff;
  border-radius:999px;
  padding:13px 20px;
  font-weight:900;
  cursor:pointer;
}

.hidden-content{
  display:none;
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid var(--border);
  color:var(--muted);
  line-height:1.7;
}

.hidden-content.open{
  display:block;
}

/* CONTRIBUTION CTA */

.contribute-section{
  padding:0 7% 100px;
}

.contribute-panel{
  max-width:1180px;
  margin:0 auto;
  background:#35102d;
  color:#fff;
  border-radius:36px;
  padding:50px;
  display:grid;
  grid-template-columns:1fr auto;
  gap:34px;
  align-items:center;
  box-shadow:var(--shadow);
}

.contribute-panel h2{
  margin:0 0 14px;
  font-size:clamp(36px,5vw,64px);
  line-height:1;
  letter-spacing:-.06em;
}

.contribute-panel p{
  margin:0;
  max-width:760px;
  color:rgba(255,255,255,.78);
  font-size:18px;
  line-height:1.7;
}

.contribute-panel .btn{
  background:#fff;
  color:var(--plum);
  white-space:nowrap;
}

/* FOOTER */

.site-footer{
  background:#fff;
  border-top:1px solid var(--border);
  padding:64px 7%;
  margin-top:40px;
}

.footer-container{
  max-width:1180px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1.3fr;
  gap:56px;
  align-items:flex-start;
}

.footer-logo-row{
  display:flex;
  align-items:center;
  gap:14px;
}

.footer-logo-row img{
  width:52px;
  height:52px;
  object-fit:contain;
}

.footer-brand h2{
  margin:0;
  font-size:42px;
  line-height:1;
  color:var(--pink);
  letter-spacing:-.05em;
}

.footer-brand p{
  margin:6px 0 0;
  font-size:14px;
  line-height:1.35;
  color:var(--muted);
  font-weight:700;
}

.footer-column{
  display:flex;
  flex-direction:column;
  gap:10px;
}

.footer-column h4{
  margin:0 0 10px;
  font-size:14px;
  color:var(--plum);
  font-weight:900;
  text-transform:uppercase;
  letter-spacing:.04em;
}

.footer-column a{
  display:block;
  color:var(--muted);
  font-size:15px;
  line-height:1.4;
}

.footer-column a:hover{
  color:var(--pink);
}

.footer-text{
  margin:0 0 14px;
  color:var(--muted);
  font-size:15px;
  line-height:1.5;
}

.footer-form{
  display:flex;
  max-width:320px;
  border:1px solid var(--border);
  border-radius:999px;
  overflow:hidden;
  background:#fff;
}

.footer-form input{
  flex:1;
  border:0;
  padding:13px 16px;
  font-size:14px;
  outline:none;
  min-width:0;
}

.footer-form button{
  width:48px;
  border:0;
  background:var(--pink);
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

/* MOBILE */

@media(max-width:950px){

  .links,
  .header-early-access{
    display:none;
  }

  .mobile-menu-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    width:48px;
    height:48px;
    border-radius:14px;
    background:var(--pink);
    color:#fff;
    border:none;
    font-size:22px;
    font-weight:900;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(236,61,134,.22);
  }

  .mobile-menu-panel{
    display:none;
    position:fixed;
    top:82px;
    left:0;
    right:0;
    z-index:99999;
    background:#fff;
    border-bottom:1px solid var(--border);
    padding:18px 24px 28px;
    box-shadow:0 20px 50px rgba(53,16,45,.12);
  }

  body.menu-open .mobile-menu-panel{
    display:block !important;
  }

  .mobile-menu-panel a{
    display:block;
    padding:14px 0;
    font-size:18px;
    font-weight:900;
    color:var(--plum);
    border-bottom:1px solid #f7ddea;
  }

  .mobile-menu-panel a:last-child{
    border-bottom:none;
    color:var(--pink);
  }

  .tells-hero{
    padding:60px 24px 40px;
  }

  .tells-hero h1{
    font-size:clamp(42px,12vw,64px);
  }

  .tells-hero p{
    font-size:17px;
  }

  .expert-panel-section,
  .filter-section,
  .tells-section,
  .contribute-section{
    padding-left:24px;
    padding-right:24px;
  }

  .expert-panel,
  .tells-grid,
  .contribute-panel{
    grid-template-columns:1fr;
  }

  .expert-panel,
  .contribute-panel{
    padding:30px;
    border-radius:28px;
  }

  .site-footer{
    padding:48px 24px;
    margin-top:30px;
  }

  .footer-container{
    grid-template-columns:1fr;
    gap:34px;
  }

  .footer-form{
    max-width:100%;
  }
}
</style>
</head>

<!-- KEEP THE REST OF YOUR PAGE EXACTLY THE SAME -->

<script>
const menuButton = document.querySelector(".mobile-menu-btn");

if(menuButton){
  menuButton.addEventListener("click", function () {
    document.body.classList.toggle("menu-open");
  });
}

const filterButtons = document.querySelectorAll(".filter-btn");
const items = document.querySelectorAll(".filter-item");

filterButtons.forEach(button => {
  button.addEventListener("click", () => {

    filterButtons.forEach(btn => {
      btn.classList.remove("active");
    });

    button.classList.add("active");

    const filter = button.dataset.filter;

    items.forEach(item => {

      if(filter === "all" || item.dataset.category === filter){
        item.style.display = "";
      } else {
        item.style.display = "none";
      }

    });

  });
});

document.querySelectorAll(".expand-btn").forEach(button => {

  button.addEventListener("click", () => {
    button.nextElementSibling.classList.toggle("open");
  });

});
</script>

</body>
</html>
