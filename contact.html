<form action="https://formspree.io/f/xdabbbbz" method="POST" class="contact-form">

  <input type="hidden" name="_subject" value="New SHE enquiry">
  <input type="hidden" name="_captcha" value="false">

  <input type="text" name="name" placeholder="Your name" required>
  <input type="email" name="email" placeholder="Your email" required>
  <input type="text" name="organisation" placeholder="Organisation">

  <select name="enquiry">
    <option value="Partnership">Partnership</option>
    <option value="Forum">Forum</option>
    <option value="Press">Press & Speaking</option>
    <option value="General">General</option>
  </select>

  <textarea name="message" placeholder="Your message" required></textarea>

  <button type="submit" class="primary-btn">Send message</button>

</form>
