<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | SHE Health</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #fff8fb;
      color: #24151d;
    }
    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 20px;
    }
    h1 {
      margin-bottom: 10px;
      font-size: 32px;
    }
    p {
      color: #6d4b5b;
      margin-bottom: 30px;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.06);
    }
    input, textarea {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid #eee;
      font-size: 14px;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      width: 100%;
      padding: 16px;
      border-radius: 999px;
      border: none;
      background: #ff4f9a;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="wrap">
    <h1>Contact SHE</h1>
    <p>Send us a message and we’ll get back to you.</p>

    <div class="card">
      <form action="https://formspree.io/f/xdabbbbz" method="POST">

        <input type="hidden" name="_subject" value="New SHE enquiry">
        <input type="hidden" name="_captcha" value="false">

        <input type="text" name="name" placeholder="Your name" required>
        <input type="email" name="email" placeholder="Your email" required>
        <textarea name="message" placeholder="Your message" required></textarea>

        <button type="submit">Send message</button>

      </form>
    </div>
  </div>

</body>
</html>
